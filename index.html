<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST CASH</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --card-border: rgba(255, 255, 255, 0.07);
            --accent-color: #00e676;
            --text-main: #ffffff;
            --text-sub: #8c9ba8;
            --danger: #ff5252;
            --bkash: #e2136e;
            --nagad: #f7921e;
            --rocket: #8c3494;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background: var(--bg-color); min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 85px; }

        .top-bar { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(10px); }
        .brand-title { font-size: 16px; font-weight: 800; }

        .view { display: none; padding: 10px 20px 20px; animation: fadeIn 0.25s ease-in-out; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .hero-card { background: linear-gradient(135deg, #16243d, #0f1728); border-radius: 20px; padding: 24px; border: 1px solid var(--card-border); margin-bottom: 16px; text-align: center; }
        .hero-balance { font-size: 34px; font-weight: 800; color: var(--accent-color); margin: 10px 0; }

        .method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .method-card { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer; }
        .method-card.selected { border-color: var(--accent-color); background: rgba(0, 230, 118, 0.05); }
        .method-card i { font-size: 24px; margin-bottom: 6px; }
        .method-card p { font-size: 12px; font-weight: 600; }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
        .input-field { width: 100%; background: var(--card-bg); border: 1px solid var(--card-border); padding: 14px; border-radius: 12px; color: #fff; font-size: 15px; outline: none; }
        .input-field:focus { border-color: var(--accent-color); }

        .btn-main { background: var(--accent-color); color: #000; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }

        .nav-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(19, 27, 46, 0.95); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--card-border); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); font-size: 11px; cursor: pointer; text-decoration: none; width: 50%; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--accent-color); }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--accent-color); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 13px; transition: transform 0.3s ease; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast" class="toast">সফল হয়েছে</div>

    <div class="app-container">
        <div class="top-bar">
            <div class="brand-title">FAST CASH</div>
            <div id="userName" style="font-size: 12px; color: var(--text-sub);">User</div>
        </div>

        <!-- HOME VIEW -->
        <div id="view-home" class="view active">
            <div class="hero-card">
                <span style="font-size: 12px; color: var(--text-sub); text-transform: uppercase;">Total Balance</span>
                <div class="hero-balance">৳ <span id="mainBalance">150.00</span></div>
            </div>
        </div>

        <!-- WITHDRAW VIEW -->
        <div id="view-withdraw" class="view">
            <div style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">পেমেন্ট মেথড সিলেক্ট করুন</div>
            <div class="method-grid">
                <div class="method-card selected" onclick="selectMethod('bKash', this)">
                    <i class="fa-solid fa-mobile-screen-button" style="color: var(--bkash);"></i>
                    <p>bKash</p>
                </div>
                <div class="method-card" onclick="selectMethod('Nagad', this)">
                    <i class="fa-solid fa-mobile-screen-button" style="color: var(--nagad);"></i>
                    <p>Nagad</p>
                </div>
                <div class="method-card" onclick="selectMethod('Rocket', this)">
                    <i class="fa-solid fa-mobile-screen-button" style="color: var(--rocket);"></i>
                    <p>Rocket</p>
                </div>
            </div>

            <div class="input-group">
                <label>একাউন্ট নম্বর (Personal)</label>
                <input type="number" id="withdrawNum" class="input-field" placeholder="017XXXXXXXX">
            </div>

            <div class="input-group">
                <label>টাকার পরিমাণ (সর্বনিম্ন ১০০ ৳)</label>
                <input type="number" id="withdrawAmt" class="input-field" placeholder="100">
            </div>

            <button class="btn-main" onclick="sendWithdrawRequest()">উইথড্র রিকোয়েস্ট পাঠান</button>
        </div>

        <!-- Bottom Navigation -->
        <div class="nav-bar">
            <a class="nav-item active" onclick="switchTab('home', this)">
                <i class="fa-solid fa-house"></i>
                <span>হোম</span>
            </a>
            <a class="nav-item" onclick="switchTab('withdraw', this)">
                <i class="fa-solid fa-wallet"></i>
                <span>উইথড্র</span>
            </a>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let selectedMethod = 'bKash';
        let userBalance = 150.00;

        let uName = tg?.initDataUnsafe?.user?.first_name || 'Demo User';
        let uId = tg?.initDataUnsafe?.user?.id || '999999';
        document.getElementById('userName').innerText = uName;
        document.getElementById('mainBalance').innerText = userBalance.toFixed(2);

        function switchTab(tabName, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + tabName).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            element.classList.add('active');
        }

        function selectMethod(method, element) {
            selectedMethod = method;
            document.querySelectorAll('.method-card').forEach(m => m.classList.remove('selected'));
            element.classList.add('selected');
        }

        function sendWithdrawRequest() {
            let num = document.getElementById('withdrawNum').value;
            let amt = parseFloat(document.getElementById('withdrawAmt').value);

            if(!num || num.length < 11) {
                showToast('সঠিক মোবাইল নম্বর দিন!');
                return;
            }
            if(!amt || amt < 100) {
                showToast('সর্বনিম্ন ১০০ টাকা তুলুন!');
                return;
            }
            if(amt > userBalance) {
                showToast('পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }

            // টেলিগ্রাম বটে নোটিফিকেশন পাঠানোর ব্যবস্থা (Telegram WebApp sendData)
            if(tg && tg.sendData) {
                let data = JSON.stringify({
                    action: "withdraw",
                    method: selectedMethod,
                    number: num,
                    amount: amt,
                    name: uName,
                    id: uId
                });
                tg.sendData(data); // সরাসরি টেলিগ্রাম বটে ডাটা চলে যাবে
            } else {
                showToast('উইথড্র সফলভাবে সাবমিট হয়েছে!');
            }
        }

        function showToast(msg) {
            let toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }
    </script>
</body>
</html>
